<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reading')}"></head>
<body>
<nav th:replace="~{fragments :: nav('home')}"></nav>

<main class="card card--wide">
	<h1 th:text="${learningSession.title}">Topic</h1>
	<p class="topic__desc" th:text="${learningSession.description}">Description</p>
	<div class="reading" th:text="${learningSession.textContent}">Text</div>

	<a class="button-start button-start--spaced"
	   th:href="@{/sessions/{id}/think(id=${learningSession.id})}" href="#">Go to questions</a>
</main>
</body>
</html>
