<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Progress')}"></head>
<body>
<nav th:replace="~{fragments :: nav('progress')}"></nav>

<main class="card card--wide">
	<h1>Progress</h1>
	<p class="notice ok" th:if="${param.saved}">Profile saved</p>

	<section class="section">
		<h2 class="section-title">Profile</h2>
		<p class="profile-head">
			<span class="avatar" th:text="${initials}">S</span>
			<span class="meta">Name: <span th:text="${displayName}">friend</span></span>
		</p>
		<p class="meta">Email: <span th:text="${email}">user@example.com</span></p>
		<p class="meta">Level: <span th:text="${profileForm.level}">A1</span></p>
		<div class="chips" th:if="${not #lists.isEmpty(interestList)}">
			<span class="chip" th:each="interest : ${interestList}" th:text="${interest}">interest</span>
		</div>
		<p class="about" th:text="${profileForm.about}">About you</p>
	</section>

	<section class="section">
		<h2 class="section-title">Edit profile</h2>
		<form th:object="${profileForm}" th:action="@{/progress}" action="/progress" method="post" novalidate>
			<label for="about">About you</label>
			<textarea id="about" rows="4" th:field="*{about}" name="about"></textarea>
			<p class="error" th:if="${#fields.hasErrors('about')}" th:errors="*{about}">error</p>

			<label for="interests">Interests</label>
			<input id="interests" type="text" th:field="*{interests}" name="interests" autocomplete="off">
			<p class="hint-inline">Separated by commas, for example: technology, sports, music</p>
			<p class="error" th:if="${#fields.hasErrors('interests')}" th:errors="*{interests}">error</p>

			<label>English level</label>
			<div class="levels">
				<label class="level" th:each="level : ${levels}">
					<input type="radio" th:field="*{level}" th:value="${level}" name="level">
					<span th:text="${level}">A1</span>
				</label>
			</div>
			<p class="error" th:if="${#fields.hasErrors('level')}" th:errors="*{level}">error</p>

			<button type="submit">Save</button>
		</form>
	</section>

	<section class="section">
		<h2 class="section-title">Session history</h2>
		<p class="meta">Sessions completed: <span th:text="${sessionCount}">0</span></p>
		<div class="empty" th:if="${#lists.isEmpty(history)}">Your sessions will appear here</div>
		<ul class="history" th:if="${not #lists.isEmpty(history)}">
			<li class="history__item" th:each="past : ${history}">
				<span th:text="${past.title}">Topic</span>
				<span class="chip" th:text="${past.status}">PROPOSED</span>
			</li>
		</ul>
	</section>
</main>
</body>
</html>
