<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Onboarding')}"></head>
<body>
<nav th:replace="~{fragments :: nav('onboarding')}"></nav>

<main class="card">
	<h1>Let's get to know each other</h1>
	<p class="hint-inline hint-inline--top">This helps us choose topics, texts and questions for you</p>

	<form th:object="${profileForm}" th:action="@{/onboarding}" action="/onboarding" method="post" novalidate>
		<label for="about">About you</label>
		<textarea id="about" rows="4" th:field="*{about}" name="about"
				  placeholder="Example: I work in IT, I learn English in the evenings, I want to read articles without a dictionary"></textarea>
		<p class="error" th:if="${#fields.hasErrors('about')}" th:errors="*{about}">error</p>

		<label for="interests">Interests</label>
		<input id="interests" type="text" th:field="*{interests}" name="interests" autocomplete="off">
		<p class="hint-inline">Separated by commas, for example: technology, sports, music</p>
		<p class="error" th:if="${#fields.hasErrors('interests')}" th:errors="*{interests}">error</p>

		<label>English level</label>
		<div class="levels">
			<label class="level" th:each="level : ${levels}">
				<input type="radio" th:field="*{level}" th:value="${level}" name="level">
				<span th:text="${level}">A1</span>
			</label>
		</div>
		<p class="error" th:if="${#fields.hasErrors('level')}" th:errors="*{level}">error</p>

		<button type="submit">Save and continue</button>
	</form>
</main>
</body>
</html>
