<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Choose a topic')}"></head>
<body>
<nav th:replace="~{fragments :: nav('home')}"></nav>

<main class="card card--wide">
	<h1>Choose a topic</h1>
	<p class="notice error" th:if="${param.error}">We could not prepare the materials. Please try again later.</p>
	<p class="hint-inline hint-inline--top">Topics are chosen based on your interests and level.</p>

	<div class="topics" th:if="${not #lists.isEmpty(topics)}">
		<div class="topic" th:each="topic, stat : ${topics}">
			<h2 class="topic__title" th:text="${topic.title}">Topic</h2>
			<p class="topic__desc" th:text="${topic.description}">Description</p>
			<form th:action="@{/sessions}" action="/sessions" method="post">
				<input type="hidden" name="topic" th:value="${stat.index}">
				<button type="submit">Start reading</button>
			</form>
		</div>
	</div>
</main>
</body>
</html>
