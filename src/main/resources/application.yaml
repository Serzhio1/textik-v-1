spring:
  application:
    name: textik-v-1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/textik}
    username: ${DB_USERNAME:textik}
    password: ${DB_PASSWORD:textik}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

  # --- Spring AI: любой OpenAI-совместимый endpoint (Яндекс, OpenAI, Groq, Ollama и т.п.) ---
  # Плейсхолдеры обязательны: без непустого api-key бины OpenAI не создаются (5.1).
  # Смена провайдера и модели — только переменные окружения, код не меняется.
  ai:
    openai:
      api-key: ${AI_API_KEY:set-placeholder-key}
      base-url: ${AI_BASE_URL:https://set-me-later.example.invalid}
      chat:
        options:
          model: ${AI_MODEL:set-me-later}
          temperature: ${AI_TEMPERATURE:0.7}

app:
  ai:
    # none — без резервной модели; stub — при сбое основной отдаём заготовленный контент.
    fallback: ${AI_FALLBACK:none}

server:
  port: 8080