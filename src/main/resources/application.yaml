spring:
  application:
    name: textik-v-1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/textik}
    username: ${DB_USERNAME:textik}
    password: ${DB_PASSWORD:textik}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

  # --- Spring AI: любой OpenAI-совместимый endpoint (GigaChat, Яндекс, OpenAI, Groq, Ollama и т.п.) ---
  # Плейсхолдер api-key обязателен: без непустого значения бины OpenAI не создаются (5.1).
  # Смена провайдера и модели — только переменные окружения, код не меняется.
  # GigaChat: AI_PROVIDER=gigachat, AI_BASE_URL=https://api.giga.chat/v1, AI_MODEL=GigaChat-2,
  #           GIGACHAT_AUTH_KEY=... (ключ из Studio → Настройки API).
  # OpenAI:   AI_PROVIDER=openai, AI_BASE_URL=https://api.openai.com, AI_MODEL=gpt-4o-mini, AI_API_KEY=sk-...
  ai:
    openai:
      api-key: ${AI_API_KEY:set-placeholder-key}
      base-url: ${AI_BASE_URL:https://api.giga.chat/v1}
      chat:
        options:
          model: ${AI_MODEL:GigaChat-2}
          temperature: ${AI_TEMPERATURE:0.7}

app:
  ai:
    # openai — обычный OpenAI-совместимый клиент; gigachat — OAuth-токен на 30 минут;
    # stub — офлайн-заглушка (то же, что профиль local).
    provider: ${AI_PROVIDER:gigachat}
    # none — без резервной модели; stub — при сбое основной отдаём заготовленный контент.
    fallback: ${AI_FALLBACK:none}
    gigachat:
      # Authorization key передаётся в Basic-заголовке как есть, без кодирования.
      auth-key: ${GIGACHAT_AUTH_KEY:}
      auth-url: ${GIGACHAT_AUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}

server:
  port: 8080