databaseChangeLog:
  - changeSet:
      id: 5-create-chat-messages
      author: textik
      comment: Chat messages of the discussion stage
      changes:
        - createTable:
            tableName: chat_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: chat_messages
            baseColumnNames: session_id
            constraintName: fk_chat_messages_session_id
            referencedTableName: sessions
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: ALTER TABLE chat_messages ADD CONSTRAINT ck_chat_messages_role CHECK (role IN ('USER', 'ASSISTANT'))